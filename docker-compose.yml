---
services:
    iVentoy:
        build:
            context: .
            args:
                IVENTOY_VERSION: "1.0.39"
        image: czyt/iventoy:latest
        container_name: iventoy
        restart: unless-stopped
        privileged: true
        hostname: iventoy
        volumes:
            - /data/iventoy/data:/iventoy/data
            - /data/iventoy/iso:/iventoy/iso
        ports:
            - 26000:26000
            - 16000:16000
            - 10809:10809
            - 69:69/udp
        environment:
            - IVENTOY_AUTO_RUN=1
